name: Build ZMK firmware
on: [push, pull_request, workflow_dispatch]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Reject tap dances that wrap mod-taps
        run: scripts/check-hold-tap-safety.sh
      - name: Check left-only layout and recovery gestures
        run: python3 scripts/check-keymap-layout.py
      - name: Check browser brief shortcuts without executing actions
        run: |
          python3 scripts/check-brief-shortcuts.py
          python3 -m unittest discover -s tests -p 'test_browser_brief.py'

  build:
    needs: validate
    # Kept in step with config/west.yml. The reusable workflow chooses the
    # Docker image, so a ZMK revision on Zephyr 4.1 must be built by a
    # workflow from the same era.
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@9ebbeff0a8b69a42f14aec022cdf16c7a107b9e0
