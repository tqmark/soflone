manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
  projects:
    - name: zmk
      remote: zmkfirmware
      # ZMK main as of 2026-09-26 (9ebbeff): Zephyr 4.1 and Hardware Model V2
      # (c06fa48, 2025-12-10), so the board is nice_nano//zmk, not nice_nano_v2.
      # No release carries Zephyr 4.1 yet (latest is v0.3), so this is a commit
      # pin, not main: an upgrade stays a deliberate step. Layer locking (ZMK
      # 5138c6f, the reason for the previous abb64ba pin) is included; &tog
      # still marks a layer locked, which is what makes "hold X, tap Z" lock
      # Lower. Keep .github/workflows/build.yml on the same commit.
      revision: 9ebbeff0a8b69a42f14aec022cdf16c7a107b9e0
      import: app/west.yml
  self:
    path: config
