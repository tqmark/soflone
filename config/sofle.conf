# Uncomment the following line to enable the Sofle OLED Display
CONFIG_ZMK_DISPLAY=y

# Custom status screen (src/status_screen.c): the built-in layout, but the
# layer name is plain text without ZMK's keyboard icon in front. Choosing a
# custom screen drops what the built-in one switches on, so it is restated
# here: the two icon widgets, the mono theme, Montserrat 16 as the default
# font (the top-row icons are glyphs in it) and the LVGL memory pool.
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
CONFIG_LV_USE_THEME_MONO=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_16=y
CONFIG_LV_Z_MEM_POOL_SIZE=4096

# Layer name (bottom line) in UNSCII 8: one-pixel strokes, lighter than the
# default Montserrat 12, which looks bold on this 1-bit OLED.
CONFIG_ZMK_LV_FONT_DEFAULT_SMALL_UNSCII_8=y

# Deep-sleep after 15 minutes idle on battery. ZMK keeps the keyboard awake
# while USB power is present; the normal 30-second OLED idle blanking remains.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Identifies the flattened, timing-safe thumb behaviors after flashing.
CONFIG_ZMK_KEYBOARD_NAME="SofleL-FlatMT"

# Uncomment these two lines to add support for encoders
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment this line below to add rgb underglow / backlight support
# CONFIG_ZMK_RGB_UNDERGLOW=y

# Uncomment the line below to disable external power toggling by the underglow.
# By default toggling the underglow on and off also toggles external power
# on and off. This also causes the display to turn off.
# CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
